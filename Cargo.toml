[package]
name = "jigen"
version = "0.1.0"
edition = "2021"
description = "Declarative 3D Scene DSL with Physics Simulation using Bevy and WASM"
license = "Apache-2.0"
repository = "https://github.com/junkawasaki/jigen"
keywords = ["3d", "dsl", "physics", "bevy", "wasm"]
categories = ["game-development", "graphics", "simulation"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []

[dependencies]
# Bevy Core
bevy = { version = "0.14", default-features = false, features = [
  "bevy_asset",
  "bevy_winit",
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_pbr",
  "bevy_sprite",
  "bevy_text",
  "bevy_ui",
  "bevy_gltf",
  "bevy_scene",
  "bevy_animation",
  "x11"  # For Linux
] }

# WASM support
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "console",
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "Node",
  "HtmlCanvasElement"
] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Math and Physics
nalgebra = { version = "0.33", features = ["serde-serialize"] }
rapier3d = { version = "0.23", features = ["serde-serialize"] }

# Graph structures
petgraph = { version = "0.6", features = ["serde-1"] }

# Logging
tracing = "0.1"
tracing-wasm = "0.2"

# Testing and Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

[dependencies.bevy_rapier3d]
version = "0.27"
features = ["serde-serialize"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-reference-types", "--enable-bulk-memory"]

[[bench]]
name = "performance_benchmarks"
harness = false
