name: Deploy GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: apps/doc/package-lock.json

    - name: Setup Rust for WASM
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2

    - name: Run tests
      run: cargo test --lib --verbose

    - name: Run benchmarks to generate performance data
      run: cargo bench -- --save-baseline main
      continue-on-error: true  # Don't fail build if benchmarks fail

    - name: Cache Node.js dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.npm
          apps/doc/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('apps/doc/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install Node.js dependencies
      run: cd apps/doc && npm ci

    - name: Copy performance data to docs
      run: |
        mkdir -p docs/api/data
        # Copy benchmark results if they exist
        if [ -d "target/criterion" ]; then
          cp -r target/criterion docs/api/data/ || true
        fi

    - name: Build dashboard for GitHub Pages
      run: make dashboard-gh-pages
      env:
        GITHUB_PAGES: true

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './docs'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
